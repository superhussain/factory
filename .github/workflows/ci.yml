name: CI
on: pull_request
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
  WRANGLER_SEND_METRICS: 'false'
jobs:
  # A run whose merge tree matches a passing run's skips every job; one whose rust inputs match skips the rust jobs.
  plan:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      all: ${{ steps.all.outputs.cache-hit }}
      all-key: ${{ steps.keys.outputs.all }}
      rust: ${{ steps.rust.outputs.cache-hit }}
      rust-key: ${{ steps.keys.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Input keys
        id: keys
        run: |
          echo "all=ci-pass-all-$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"
          rust="$(git rev-parse HEAD:rust HEAD:tests/parity HEAD:skills HEAD:tests/cli/support.py HEAD:tests/fixtures/cli-v1.json HEAD:.github/workflows/ci.yml | sha256sum | cut -c1-40)"
          echo "rust=ci-pass-rust-$rust" >> "$GITHUB_OUTPUT"
      - name: Look up a passing run of this tree
        id: all
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-pass
          key: ${{ steps.keys.outputs.all }}
          lookup-only: true
      - name: Look up a passing rust run of these inputs
        id: rust
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-pass
          key: ${{ steps.keys.outputs.rust }}
          lookup-only: true
  targets:
    needs: plan
    if: needs.plan.outputs.all != 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/ci-setup
      - name: Install gitleaks
        run: |
          curl -sSfLo "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Secret scan
        run: python3 tools/secret-scan.py
      - name: Restore browser provision
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .context/browser
          key: browser-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            browser-${{ runner.os }}-
      # assets runs a browser test, so this job provisions the browser too; only the browser shards save its cache.
      - run: node tests/browser/provision.mjs
      - run: pnpm run format:check
      # Workflow-only changes select no Nx target; the workflow contracts always run.
      - run: pnpm run test:workflow
      - name: Affected base and head
        run: |
          echo "NX_BASE=$(git merge-base "origin/$GITHUB_BASE_REF" HEAD)" >> "$GITHUB_ENV"
          echo "NX_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Nx affected
        run: pnpm exec nx affected -t auth protocol assets deploy local --base="$NX_BASE" --head="$NX_HEAD"
      - run: git diff --check
  python:
    needs: plan
    if: needs.plan.outputs.all != 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/ci-setup
      # With no entry of its own, a pull request restores the nightly main entry (nx-cache-warm.yml).
      - name: Restore and save the Nx folder for this pull request
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .nx
          key: nx-${{ runner.os }}-pr${{ github.event.pull_request.number }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            nx-${{ runner.os }}-pr${{ github.event.pull_request.number }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nx-${{ runner.os }}-main-${{ hashFiles('pnpm-lock.yaml') }}-
      # Nx names its task database after the machine id, so a restored database takes this runner's name.
      - name: Adopt the restored Nx database
        run: |
          shopt -s nullglob
          mkdir -p "$RUNNER_TEMP/nx-db"
          node -e "require('nx/src/native').connectToNxDb(process.argv[1])" "$RUNNER_TEMP/nx-db"
          fresh=("$RUNNER_TEMP"/nx-db/*.db)
          restored=(.nx/workspace-data/*.db)
          if [ "${#fresh[@]}" -eq 1 ] && [ "${#restored[@]}" -eq 1 ]; then
            name="$(basename "${fresh[0]}")"
            if [ "${restored[0]}" != ".nx/workspace-data/$name" ]; then
              mv "${restored[0]}" ".nx/workspace-data/$name"
              echo "Renamed ${restored[0]} to $name"
            fi
          fi
      - name: Python suites
        run: pnpm exec nx run-many -t cli install verify
  browser:
    needs: plan
    if: needs.plan.outputs.all != 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      FACTORY_BROWSER_SHARD: ${{ matrix.shard }}/4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/ci-setup
      - name: Changed applications
        id: changed
        run: |
          if [ -n "$(git diff --name-only "$(git merge-base "origin/$GITHUB_BASE_REF" HEAD)" HEAD -- . ':!docs' ':!*.md')" ]; then
            echo "apps_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "apps_changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Cache browser provision
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .context/browser
          key: browser-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            browser-${{ runner.os }}-
      - if: steps.changed.outputs.apps_changed == 'true'
        run: node tests/browser/provision.mjs
      - name: Affected base and head
        run: |
          echo "NX_BASE=$(git merge-base "origin/$GITHUB_BASE_REF" HEAD)" >> "$GITHUB_ENV"
          echo "NX_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Nx affected browser
        run: pnpm exec nx affected -t browser --base="$NX_BASE" --head="$NX_HEAD"
  paseo-plugin:
    needs: plan
    if: needs.plan.outputs.all != 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
      - run: pnpm --dir paseo-plugin install --frozen-lockfile
      - run: pnpm --dir paseo-plugin run typecheck
      - run: pnpm run test:paseo-plugin
  # The release binary keeps panic = "abort"; cargo test needs unwinding, so build and test are separate jobs.
  rust-build:
    needs: plan
    if: needs.plan.outputs.all != 'true' && needs.plan.outputs.rust != 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust
      - name: Build linux-x64
        run: cargo build --release --locked
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Startup
        working-directory: .
        run: python3 tests/parity/startup.py --bin rust/target/release/factory
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: factory-linux-x64
          path: rust/target/release/factory
          retention-days: 1
  rust-test:
    needs: plan
    if: needs.plan.outputs.all != 'true' && needs.plan.outputs.rust != 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 6
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust
      - name: Test linux-x64
        run: cargo test --locked
  # Type-checks the darwin-arm64 and windows-x64 targets.
  rust-check:
    needs: plan
    if: needs.plan.outputs.all != 'true' && needs.plan.outputs.rust != 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 6
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain and targets
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-pc-windows-gnu
      - name: Format
        run: cargo fmt --check
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust
      - name: Check darwin-arm64
        run: cargo check --locked --target aarch64-apple-darwin
      - name: Check windows-x64
        run: cargo check --locked --target x86_64-pc-windows-gnu
  parity:
    needs: rust-build
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: factory-linux-x64
          path: rust/target/release
      - name: Parity
        run: |
          chmod +x rust/target/release/factory
          python3 tests/parity/run.py --bin rust/target/release/factory --ids rust/parity --shard ${{ matrix.shard }}/4
  ci:
    if: ${{ !cancelled() }}
    needs: [plan, targets, python, browser, paseo-plugin, rust-build, rust-test, rust-check, parity]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: All CI jobs passed
        env:
          RESULTS: plan=${{ needs.plan.result }} targets=${{ needs.targets.result }} python=${{ needs.python.result }} browser=${{ needs.browser.result }} paseo-plugin=${{ needs.paseo-plugin.result }} rust-build=${{ needs.rust-build.result }} rust-test=${{ needs.rust-test.result }} rust-check=${{ needs.rust-check.result }} parity=${{ needs.parity.result }}
          ALL_HIT: ${{ needs.plan.outputs.all }}
          RUST_HIT: ${{ needs.plan.outputs.rust }}
        run: |
          status=0
          for pair in $RESULTS; do
            name="${pair%%=*}"
            result="${pair#*=}"
            echo "$name: $result"
            if [ "$result" = skipped ] && [ "$name" != plan ] && { [ "$ALL_HIT" = true ] || { [ "$RUST_HIT" = true ] && case "$name" in rust-*|parity) true ;; *) false ;; esac; }; }; then
              echo "$name: inputs unchanged since a passing run"
            elif [ "$result" != "success" ]; then
              echo "CI job $name finished as $result; see its log above." >&2
              status=1
            fi
          done
          exit "$status"
      - if: ${{ !cancelled() }}
        run: mkdir -p .ci-pass && echo pass > .ci-pass/pass
      - name: Record a passing rust run of these inputs
        if: ${{ !cancelled() && needs.rust-build.result == 'success' && needs.rust-test.result == 'success' && needs.rust-check.result == 'success' && needs.parity.result == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-pass
          key: ${{ needs.plan.outputs.rust-key }}
      - name: Record a passing run of this tree
        if: needs.plan.outputs.all != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-pass
          key: ${{ needs.plan.outputs.all-key }}
