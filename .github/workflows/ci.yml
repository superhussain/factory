name: CI
on: pull_request
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  WRANGLER_SEND_METRICS: 'false'
jobs:
  # Markers are used and saved only for same-repo PRs; a fork PR always runs everything.
  # A run whose merge tree matches a passing run's skips every job; one whose rust inputs match skips the rust jobs.
  plan:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      all: ${{ steps.all.outputs.cache-hit }}
      all-key: ${{ steps.keys.outputs.all }}
      rust: ${{ steps.rust.outputs.cache-hit }}
      rust-key: ${{ steps.keys.outputs.rust }}
      browser: ${{ steps.browser.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Input keys
        id: keys
        run: |
          echo "all=ci-pass-all-$(git rev-parse 'HEAD^{tree}')-$(git merge-base "origin/$GITHUB_BASE_REF" HEAD)" >> "$GITHUB_OUTPUT"
          rust="$(git rev-parse HEAD:rust HEAD:tests/parity HEAD:skills HEAD:tools HEAD:worker/admission.js HEAD:tests/fixtures HEAD:.github/workflows/ci.yml | sha256sum | cut -c1-40)"
          echo "rust=ci-pass-rust-$rust" >> "$GITHUB_OUTPUT"
      # The browser target's Nx inputs in nx.json and tools/project.json, plus nx.json, paseo-plugin, this workflow
      # and its setup action. A PR that changes none of them, such as a Rust-only one, skips the eight browser shards.
      - name: Browser inputs
        id: browser
        run: |
          if git diff --quiet "$(git merge-base "origin/$GITHUB_BASE_REF" HEAD)" HEAD -- web worker tools ':!tools/deploy.mjs' tests/browser tests/support tests/fixtures/browser-cases.json tests/fixtures/inbox-count.json tests/fixtures/project-documents.md tests/fixtures/project-document-notes.md tests/fixtures/project-settings-board.json tests/fixtures/hosts-list.json tests/fixtures/walkthrough-map.html tests/fixtures/walkthrough-rich.html tests/fixtures/retro-backlog-context.txt skills/factory/references/pickup.md tsconfig.json package.json pnpm-lock.yaml .node-version THIRD_PARTY_NOTICES.md nx.json paseo-plugin .github/workflows/ci.yml .github/actions; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Look up a passing run of this tree
        if: github.event.pull_request.head.repo.full_name == github.repository
        id: all
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-pass
          key: ${{ steps.keys.outputs.all }}
          lookup-only: true
      - name: Look up a passing rust run of these inputs
        if: github.event.pull_request.head.repo.full_name == github.repository
        id: rust
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-pass
          key: ${{ steps.keys.outputs.rust }}
          lookup-only: true
  targets:
    needs: plan
    if: needs.plan.outputs.all != 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/ci-setup
      - name: Install gitleaks
        run: |
          curl -sSfLo "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Secret scan
        run: node tools/secret-scan.mjs
      - name: Restore browser provision
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .context/browser
          key: browser-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            browser-${{ runner.os }}-
      # assets runs a browser test, so this job provisions the browser too; only warm.yml saves its cache.
      - run: node tests/browser/provision.mjs
      - run: pnpm run format:check
      # Workflow-only changes select no Nx target; the workflow contracts always run.
      - run: pnpm run test:workflow
      - name: Affected base and head
        run: |
          echo "NX_BASE=$(git merge-base "origin/$GITHUB_BASE_REF" HEAD)" >> "$GITHUB_ENV"
          echo "NX_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Nx affected
        run: pnpm exec nx affected -t auth protocol assets deploy verify --base="$NX_BASE" --head="$NX_HEAD"
      - run: git diff --check
  # The local target runs device flows through the factory binary, so a Rust change always selects it. Its own job
  # runs it beside targets' scans and checks instead of after them, and needs no gitleaks or browser. It waits for
  # rust-build: started beside it, it reached the binary restore before rust-build saved the binary, and spent
  # 25-40 s installing the toolchain and building the same binary again. A rust hit skips rust-build, and local
  # then restores the binary an earlier run cached.
  local:
    needs: [plan, rust-build]
    if: ${{ !cancelled() && needs.plan.outputs.all != 'true' && (needs.rust-build.result == 'success' || needs.rust-build.result == 'skipped') }}
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/ci-setup
      # This job restores the binary rust-build cached under the rust key, and builds it only when that cache is gone.
      - name: Restore the factory binary
        id: factory-bin
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: rust/target/host/factory
          key: ${{ needs.plan.outputs.rust-key }}-bin
      - name: Install the pinned toolchain
        if: steps.factory-bin.outputs.cache-hit != 'true'
        working-directory: rust
        run: rustup toolchain install
      - if: steps.factory-bin.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v2-rust
          workspaces: rust
          save-if: false
      # The incremental artifacts warm.yml saves from main, which this job only reads, cut that build to a few seconds.
      - name: Restore incremental artifacts
        if: steps.factory-bin.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: rust/target/host/incremental
          key: v1-rust-incr-${{ hashFiles('rust/rust-toolchain.toml', 'rust/Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: v1-rust-incr-${{ hashFiles('rust/rust-toolchain.toml', 'rust/Cargo.lock') }}-
      - name: Build the factory binary
        if: steps.factory-bin.outputs.cache-hit != 'true'
        working-directory: rust
        run: CARGO_INCREMENTAL=1 cargo build --profile host --locked
      - name: Affected base and head
        run: |
          echo "NX_BASE=$(git merge-base "origin/$GITHUB_BASE_REF" HEAD)" >> "$GITHUB_ENV"
          echo "NX_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Nx affected local
        run: pnpm exec nx affected -t local --base="$NX_BASE" --head="$NX_HEAD"
  browser:
    needs: plan
    if: needs.plan.outputs.all != 'true' && needs.plan.outputs.browser == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      FACTORY_BROWSER_SHARD: ${{ matrix.shard }}/8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/ci-setup
      - name: Changed applications
        id: changed
        run: |
          if [ -n "$(git diff --name-only "$(git merge-base "origin/$GITHUB_BASE_REF" HEAD)" HEAD -- . ':!docs' ':!*.md')" ]; then
            echo "apps_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "apps_changed=false" >> "$GITHUB_OUTPUT"
          fi
      # warm.yml saves the provision from main, so a PR never adds its own copy to the cache budget.
      - name: Restore browser provision
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .context/browser
          key: browser-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            browser-${{ runner.os }}-
      - if: steps.changed.outputs.apps_changed == 'true'
        run: node tests/browser/provision.mjs
      - name: Affected base and head
        run: |
          echo "NX_BASE=$(git merge-base "origin/$GITHUB_BASE_REF" HEAD)" >> "$GITHUB_ENV"
          echo "NX_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Nx affected browser
        run: pnpm exec nx affected -t browser --base="$NX_BASE" --head="$NX_HEAD"
  paseo-plugin:
    needs: plan
    if: needs.plan.outputs.all != 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
      - run: pnpm --dir paseo-plugin install --frozen-lockfile
      - run: pnpm --dir paseo-plugin run typecheck
      - run: pnpm run test:paseo-plugin
  # The host binary keeps panic = "abort"; cargo test needs unwinding, so build and test are separate jobs.
  # rust-cache keys on Cargo.lock, Cargo.toml and rustc, so a source-only change reuses the compiled dependencies.
  # warm.yml saves the same keys, and the incremental artifacts, from main, so a PR's first run starts warm too.
  # The key leaves out Cargo.toml's [profile] tables, so a profile change must bump prefix-key here and in warm.yml.
  rust-build:
    needs: plan
    if: needs.plan.outputs.all != 'true' && needs.plan.outputs.rust != 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v2-rust
          workspaces: rust
      # rust-cache keeps only dependencies and sets CARGO_INCREMENTAL=0, so each source change compiled the factory
      # crate from scratch. main's incremental artifacts, which warm.yml saves, let rustc reuse the unchanged codegen
      # units. rustc checks every artifact against the current source, compiler and dependencies, so a stale one
      # only costs reuse; the key still pins the toolchain and lockfile so a bump starts clean. A PR run only
      # restores them: a save per run, about 50 MB each, filled the repo's cache budget and evicted main's caches.
      - name: Restore incremental artifacts
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: rust/target/host/incremental
          key: v1-rust-incr-${{ hashFiles('rust/rust-toolchain.toml', 'rust/Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: v1-rust-incr-${{ hashFiles('rust/rust-toolchain.toml', 'rust/Cargo.lock') }}-
      - name: Build linux-x64
        run: CARGO_INCREMENTAL=1 cargo build --profile host --locked
      # The rust key covers every input of this binary; the -bin suffix keeps it apart from the pass marker.
      - name: Cache the factory binary for local
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: rust/target/host/factory
          key: ${{ needs.plan.outputs.rust-key }}-bin
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: factory-linux-x64
          path: rust/target/host/factory
          retention-days: 1
      # A first install with no Python: a temp HOME, so a cold cache, and a temp skills root. install.sh finds the
      # binary built above in rust/target, stamps it, and factory install caches that build instead of compiling
      # again. The grep proves the stamp was trusted, since a rebuild would also pass.
      # CARGO_INCREMENTAL=1 as in the build: cargo fingerprints the setting, and rust-cache's 0 would rebuild.
      - name: Install with tools/install.sh
        run: |
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          rustup_home="${RUSTUP_HOME:-$HOME/.rustup}"
          root="$(mktemp -d)"
          out="$(CARGO_INCREMENTAL=1 HOME="$root/home" CARGO_HOME="$cargo_home" RUSTUP_HOME="$rustup_home" sh ../tools/install.sh "$root/skills" 2>&1)"
          printf '%s\n' "$out"
          printf '%s\n' "$out" | grep -qx "install: Rust binary from $PWD/target/host/factory"
          test -x "$root/skills/factory/runtime/factory"
          grep -q '"entry": \["runtime/factory"\]' "$root/skills/factory/bundle.json"
  rust-test:
    # Without a name, the check would carry each shard's whole heavy-test filter.
    name: rust-test (${{ matrix.shard }})
    needs: plan
    if: needs.plan.outputs.all != 'true' && needs.plan.outputs.rust != 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 6
    # nextest runs each test in its own process, so tests that hold TEST_ENV_LOCK no longer wait on each other,
    # and hash partitions split the tests over the shards by name, so a test keeps its shard as others come and
    # go. The hash put all three heavy tests, the priority-100 ones in rust/.config/nextest.toml, in shard 2,
    # whose test step took 29-34 s against shard 1's 13-19 s. So every shard leaves them out of its partition
    # and runs its own share of them beside it.
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 1
            heavy: test(=commands::audit::tests::pr_merge_is_linear) | test(=commands::retro::tests::redact_supersets_cover_every_match)
          - shard: 2
            heavy: test(=commands::retro::tests::redact_matches_every_pass_run_unfiltered)
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v2-rust
          workspaces: rust
      # As in rust-build, the newest incremental artifacts let rustc reuse the unchanged codegen units of the test
      # build. Only warm.yml saves them, from main: at about 200 MB a copy, a save per PR run would crowd main's
      # warm caches out of the repo's cache budget, and a PR's diff from main is what it recompiles either way.
      - name: Restore incremental artifacts
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: rust/target/debug/incremental
          key: v1-rust-test-incr-${{ hashFiles('rust/rust-toolchain.toml', 'rust/Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: v1-rust-test-incr-${{ hashFiles('rust/rust-toolchain.toml', 'rust/Cargo.lock') }}-
      - name: Install cargo-nextest
        run: |
          curl -sSfLo "$RUNNER_TEMP/nextest.tar.gz" https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.152/cargo-nextest-0.9.152-x86_64-unknown-linux-gnu.tar.gz
          echo "d039b43c3e0958441b6ad0a39c8884d018b3d2e8fb9928f209074b1100b5e17a  $RUNNER_TEMP/nextest.tar.gz" | sha256sum -c
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/nextest.tar.gz" -C "$RUNNER_TEMP/bin" cargo-nextest
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # nextest builds with cargo test --no-run, so this is the build it runs.
      - name: Build the tests
        run: CARGO_INCREMENTAL=1 cargo test --locked --no-run
      - name: Test linux-x64
        env:
          HEAVY: ${{ matrix.heavy }}
          ALL_HEAVY: test(=commands::audit::tests::pr_merge_is_linear) | test(=commands::retro::tests::redact_supersets_cover_every_match) | test(=commands::retro::tests::redact_matches_every_pass_run_unfiltered)
        run: |
          CARGO_INCREMENTAL=1 cargo nextest run --locked --no-fail-fast -E "$HEAVY" &
          heavy=$!
          status=0
          CARGO_INCREMENTAL=1 cargo nextest run --locked --no-fail-fast --partition hash:${{ matrix.shard }}/2 -E "not ($ALL_HEAVY)" || status=1
          wait "$heavy" || status=1
          exit "$status"
  # Type-checks the darwin-arm64 and windows-x64 targets.
  rust-check:
    needs: plan
    if: needs.plan.outputs.all != 'true' && needs.plan.outputs.rust != 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 6
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain and targets
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-pc-windows-gnu
      - name: Format
        run: cargo fmt --check
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v2-rust
          workspaces: rust
      - name: Check darwin-arm64
        run: cargo check --locked --target aarch64-apple-darwin
      - name: Check windows-x64
        run: cargo check --locked --target x86_64-pc-windows-gnu
  parity:
    needs: rust-build
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: factory-linux-x64
          path: rust/target/host
      - name: Parity
        run: |
          chmod +x rust/target/host/factory
          node tests/parity/run.mjs --bin rust/target/host/factory --ids rust/parity --shard ${{ matrix.shard }}/6
  ci:
    if: ${{ !cancelled() }}
    needs: [plan, targets, local, browser, paseo-plugin, rust-build, rust-test, rust-check, parity]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: All CI jobs passed
        env:
          RESULTS: plan=${{ needs.plan.result }} targets=${{ needs.targets.result }} local=${{ needs.local.result }} browser=${{ needs.browser.result }} paseo-plugin=${{ needs.paseo-plugin.result }} rust-build=${{ needs.rust-build.result }} rust-test=${{ needs.rust-test.result }} rust-check=${{ needs.rust-check.result }} parity=${{ needs.parity.result }}
          ALL_HIT: ${{ needs.plan.outputs.all }}
          RUST_HIT: ${{ needs.plan.outputs.rust }}
          BROWSER_RUN: ${{ needs.plan.outputs.browser }}
        run: |
          status=0
          for pair in $RESULTS; do
            name="${pair%%=*}"
            result="${pair#*=}"
            echo "$name: $result"
            if [ "$result" = skipped ] && [ "$name" != plan ] && { [ "$ALL_HIT" = true ] || { [ "$RUST_HIT" = true ] && case "$name" in rust-*|parity) true ;; *) false ;; esac; }; }; then
              echo "$name: inputs unchanged since a passing run"
            elif [ "$result" = skipped ] && [ "$name" = browser ] && [ "$BROWSER_RUN" = false ]; then
              echo "browser: no browser input changed"
            elif [ "$result" != "success" ]; then
              echo "CI job $name finished as $result; see its log above." >&2
              status=1
            fi
          done
          exit "$status"
      - if: ${{ !cancelled() }}
        run: mkdir -p .ci-pass && echo pass > .ci-pass/pass
      - name: Record a passing rust run of these inputs
        if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository && needs.rust-build.result == 'success' && needs.rust-test.result == 'success' && needs.rust-check.result == 'success' && needs.parity.result == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-pass
          key: ${{ needs.plan.outputs.rust-key }}
      - name: Record a passing run of this tree
        if: github.event.pull_request.head.repo.full_name == github.repository && needs.plan.outputs.all != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-pass
          key: ${{ needs.plan.outputs.all-key }}
