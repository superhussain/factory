name: CI
on: pull_request
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  WRANGLER_SEND_METRICS: 'false'
jobs:
  # Markers are used and saved only for same-repo PRs; a fork PR always runs everything.
  # A run whose merge tree matches a passing run's skips every job; one whose rust inputs match skips the rust jobs.
  plan:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      all: ${{ steps.all.outputs.cache-hit }}
      all-key: ${{ steps.keys.outputs.all }}
      rust: ${{ steps.rust.outputs.cache-hit }}
      rust-key: ${{ steps.keys.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Input keys
        id: keys
        run: |
          echo "all=ci-pass-all-$(git rev-parse 'HEAD^{tree}')-$(git merge-base "origin/$GITHUB_BASE_REF" HEAD)" >> "$GITHUB_OUTPUT"
          rust="$(git rev-parse HEAD:rust HEAD:tests/parity HEAD:skills HEAD:tools HEAD:worker/admission.js HEAD:tests/fixtures HEAD:.github/workflows/ci.yml | sha256sum | cut -c1-40)"
          echo "rust=ci-pass-rust-$rust" >> "$GITHUB_OUTPUT"
      - name: Look up a passing run of this tree
        if: github.event.pull_request.head.repo.full_name == github.repository
        id: all
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-pass
          key: ${{ steps.keys.outputs.all }}
          lookup-only: true
      - name: Look up a passing rust run of these inputs
        if: github.event.pull_request.head.repo.full_name == github.repository
        id: rust
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-pass
          key: ${{ steps.keys.outputs.rust }}
          lookup-only: true
  # The local target's device flows run the factory binary. targets restores the one rust-build cached under
  # the rust key, and builds it only on a miss, so it never waits on rust-build.
  targets:
    needs: plan
    if: needs.plan.outputs.all != 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/ci-setup
      - name: Install gitleaks
        run: |
          curl -sSfLo "$RUNNER_TEMP/gitleaks.tar.gz" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Secret scan
        run: node tools/secret-scan.mjs
      - name: Restore browser provision
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .context/browser
          key: browser-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            browser-${{ runner.os }}-
      # assets runs a browser test, so this job provisions the browser too; only the browser shards save its cache.
      - run: node tests/browser/provision.mjs
      - run: pnpm run format:check
      # Workflow-only changes select no Nx target; the workflow contracts always run.
      - run: pnpm run test:workflow
      - name: Restore the factory binary
        id: factory-bin
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: rust/target/host/factory
          key: ${{ needs.plan.outputs.rust-key }}-bin
      - name: Install the pinned toolchain
        if: steps.factory-bin.outputs.cache-hit != 'true'
        working-directory: rust
        run: rustup toolchain install
      - if: steps.factory-bin.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust
          workspaces: rust
          save-if: false
      - name: Build the factory binary
        if: steps.factory-bin.outputs.cache-hit != 'true'
        working-directory: rust
        run: cargo build --profile host --locked
      - name: Affected base and head
        run: |
          echo "NX_BASE=$(git merge-base "origin/$GITHUB_BASE_REF" HEAD)" >> "$GITHUB_ENV"
          echo "NX_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Nx affected
        run: pnpm exec nx affected -t auth protocol assets deploy local verify --base="$NX_BASE" --head="$NX_HEAD"
      - run: git diff --check
  browser:
    needs: plan
    if: needs.plan.outputs.all != 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      FACTORY_BROWSER_SHARD: ${{ matrix.shard }}/4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/ci-setup
      - name: Changed applications
        id: changed
        run: |
          if [ -n "$(git diff --name-only "$(git merge-base "origin/$GITHUB_BASE_REF" HEAD)" HEAD -- . ':!docs' ':!*.md')" ]; then
            echo "apps_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "apps_changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Cache browser provision
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .context/browser
          key: browser-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            browser-${{ runner.os }}-
      - if: steps.changed.outputs.apps_changed == 'true'
        run: node tests/browser/provision.mjs
      - name: Affected base and head
        run: |
          echo "NX_BASE=$(git merge-base "origin/$GITHUB_BASE_REF" HEAD)" >> "$GITHUB_ENV"
          echo "NX_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Nx affected browser
        run: pnpm exec nx affected -t browser --base="$NX_BASE" --head="$NX_HEAD"
  paseo-plugin:
    needs: plan
    if: needs.plan.outputs.all != 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/ci-setup
      - run: pnpm --dir paseo-plugin install --frozen-lockfile
      - run: pnpm --dir paseo-plugin run typecheck
      - run: pnpm run test:paseo-plugin
  # The host binary keeps panic = "abort"; cargo test needs unwinding, so build and test are separate jobs.
  # rust-cache keys on Cargo.lock, Cargo.toml and rustc, so a source-only change reuses the compiled dependencies.
  rust-build:
    needs: plan
    if: needs.plan.outputs.all != 'true' && needs.plan.outputs.rust != 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 8
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust
          workspaces: rust
      # rust-cache keeps only dependencies and sets CARGO_INCREMENTAL=0, so each source change compiled the factory
      # crate from scratch. This PR's previous build's incremental artifacts let rustc reuse the unchanged codegen
      # units. rustc checks every artifact against the current source, compiler and dependencies, so a stale one
      # only costs reuse; the key still pins the toolchain and lockfile so a bump starts clean.
      - name: Restore incremental artifacts
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: rust/target/host/incremental
          key: v1-rust-incr-${{ hashFiles('rust/rust-toolchain.toml', 'rust/Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: v1-rust-incr-${{ hashFiles('rust/rust-toolchain.toml', 'rust/Cargo.lock') }}-
      - name: Build linux-x64
        run: CARGO_INCREMENTAL=1 cargo build --profile host --locked
      # Saved before rust-cache's post step, which deletes incremental artifacts from rust/target.
      - name: Save incremental artifacts
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: rust/target/host/incremental
          key: v1-rust-incr-${{ hashFiles('rust/rust-toolchain.toml', 'rust/Cargo.lock') }}-${{ github.run_id }}-${{ github.run_attempt }}
      # The rust key covers every input of this binary; the -bin suffix keeps it apart from the pass marker.
      - name: Cache the factory binary for targets
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: rust/target/host/factory
          key: ${{ needs.plan.outputs.rust-key }}-bin
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: factory-linux-x64
          path: rust/target/host/factory
          retention-days: 1
      # A first install with no Python: a temp HOME, so a cold cache, and a temp skills root. install.sh finds the
      # binary built above in rust/target, and factory install caches that build instead of compiling again.
      - name: Install with tools/install.sh
        run: |
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          rustup_home="${RUSTUP_HOME:-$HOME/.rustup}"
          root="$(mktemp -d)"
          HOME="$root/home" CARGO_HOME="$cargo_home" RUSTUP_HOME="$rustup_home" sh ../tools/install.sh "$root/skills"
          test -x "$root/skills/factory/runtime/factory"
          grep -q '"entry": \["runtime/factory"\]' "$root/skills/factory/bundle.json"
  rust-test:
    needs: plan
    if: needs.plan.outputs.all != 'true' && needs.plan.outputs.rust != 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 6
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust
          workspaces: rust
      - name: Test linux-x64
        run: cargo test --locked
  # Type-checks the darwin-arm64 and windows-x64 targets.
  rust-check:
    needs: plan
    if: needs.plan.outputs.all != 'true' && needs.plan.outputs.rust != 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 6
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned toolchain and targets
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-pc-windows-gnu
      - name: Format
        run: cargo fmt --check
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust
          workspaces: rust
      - name: Check darwin-arm64
        run: cargo check --locked --target aarch64-apple-darwin
      - name: Check windows-x64
        run: cargo check --locked --target x86_64-pc-windows-gnu
  parity:
    needs: rust-build
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: factory-linux-x64
          path: rust/target/host
      - name: Parity
        run: |
          chmod +x rust/target/host/factory
          node tests/parity/run.mjs --bin rust/target/host/factory --ids rust/parity --shard ${{ matrix.shard }}/6
  ci:
    if: ${{ !cancelled() }}
    needs: [plan, targets, browser, paseo-plugin, rust-build, rust-test, rust-check, parity]
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: All CI jobs passed
        env:
          RESULTS: plan=${{ needs.plan.result }} targets=${{ needs.targets.result }} browser=${{ needs.browser.result }} paseo-plugin=${{ needs.paseo-plugin.result }} rust-build=${{ needs.rust-build.result }} rust-test=${{ needs.rust-test.result }} rust-check=${{ needs.rust-check.result }} parity=${{ needs.parity.result }}
          ALL_HIT: ${{ needs.plan.outputs.all }}
          RUST_HIT: ${{ needs.plan.outputs.rust }}
        run: |
          status=0
          for pair in $RESULTS; do
            name="${pair%%=*}"
            result="${pair#*=}"
            echo "$name: $result"
            if [ "$result" = skipped ] && [ "$name" != plan ] && { [ "$ALL_HIT" = true ] || { [ "$RUST_HIT" = true ] && case "$name" in rust-*|parity) true ;; *) false ;; esac; }; }; then
              echo "$name: inputs unchanged since a passing run"
            elif [ "$result" != "success" ]; then
              echo "CI job $name finished as $result; see its log above." >&2
              status=1
            fi
          done
          exit "$status"
      - if: ${{ !cancelled() }}
        run: mkdir -p .ci-pass && echo pass > .ci-pass/pass
      - name: Record a passing rust run of these inputs
        if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository && needs.rust-build.result == 'success' && needs.rust-test.result == 'success' && needs.rust-check.result == 'success' && needs.parity.result == 'success' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-pass
          key: ${{ needs.plan.outputs.rust-key }}
      - name: Record a passing run of this tree
        if: github.event.pull_request.head.repo.full_name == github.repository && needs.plan.outputs.all != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-pass
          key: ${{ needs.plan.outputs.all-key }}
