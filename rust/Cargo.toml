[workspace]
members = ["factory"]
resolver = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

# The installer's and CI's build: no LTO and parallel incremental codegen rebuild a one-file change in seconds.
[profile.host]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
