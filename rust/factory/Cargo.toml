[package]
name = "factory"
version = "0.0.0"
edition = "2021"
publish = false
license = "MIT"

[dependencies]
fancy-regex = "0.20"
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
sha2 = "0.10"
tungstenite = { version = "0.30", default-features = false, features = ["handshake", "native-tls"] }
ureq = { version = "3", default-features = false, features = ["native-tls-no-default"] }
