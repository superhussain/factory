# CI's rust-test shards run with nextest. A shard lasts at least as long as its slowest test, so the slow tests
# start first instead of after the hundreds of fast ones ahead of them in name order.

# The tests that take 5 s or more on a CI runner: regex searches over the parity corpus or long inputs.
[[profile.default.overrides]]
filter = '''
test(=commands::audit::tests::pr_merge_is_linear)
| test(=commands::retro::tests::redact_matches_every_pass_run_unfiltered)
| test(=commands::retro::tests::redact_supersets_cover_every_match)
'''
priority = 100

# Tests that wait 5 to 6 s on a real timer.
[[profile.default.overrides]]
filter = '''
test(=commands::tracer::tests::slow_streaming_body_is_read)
| test(=commands::tracer::tests::slow_tracer_times_out_once)
| test(=commands::daemon::tests::sigterm_logs_stop_closes_and_returns_ok)
'''
priority = 50
